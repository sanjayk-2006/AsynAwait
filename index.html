<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Fetch Api</h2>
    <button onclick="userTryCatch()">Fetch</button>
    <pre id="output"></pre>


    <script>
        async function userTryCatch() {
            const output = document.getElementById("output")
            output.textContent +=  "fetching data form Ap ...\n";

            try{
                const response=await fetch('https://jsonplaceholder.typicode.com/users')

                if (response.ok){
                    const data=await response.json()
                    output.textContent +="Api data :\n"+JSON.stringify(data,null,2);

                }
                else{
                    output.textContent=`staus errror ${response.status}`
                }
            }
            catch(error){
                output.textContent="Error "+error
            }
            finally{
                output.textContent+="\n\n---\nOperation Completed(finally block)."
            }
            

        }
    </script>
</body>
</html>
